name: KKS official source freshness

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'knowledge-supporting/manifests/official-source-catalog-r1.json'
      - 'scripts/check_official_source_freshness.py'
      - '.github/workflows/kks-official-source-freshness.yml'

permissions:
  contents: read

concurrency:
  group: kks-official-source-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check allowlisted official documentation
        run: python scripts/check_official_source_freshness.py --output source-freshness-report.json
      - name: Publish report in job summary
        if: always()
        run: |
          if [ -f source-freshness-report.json ]; then
            echo '## KKS official source freshness' >> "$GITHUB_STEP_SUMMARY"
            echo 'Metadata-only check. No knowledge content or repository files are automatically updated.' >> "$GITHUB_STEP_SUMMARY"
            python -m json.tool source-freshness-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload source freshness report
        if: always() && hashFiles('source-freshness-report.json') != ''
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: kks-official-source-freshness
          path: source-freshness-report.json
          if-no-files-found: error
          retention-days: 30
