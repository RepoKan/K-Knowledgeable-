name: MCP app validation

on:
  pull_request:
    paths:
      - 'mcp-apps/kks-source-explorer/**'
      - '.github/workflows/mcp-app-validation.yml'
  push:
    branches: [main]
    paths:
      - 'mcp-apps/kks-source-explorer/**'
      - '.github/workflows/mcp-app-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp-apps/kks-source-explorer
    env:
      SKYBRIDGE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp-apps/kks-source-explorer/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run fixture tests
        run: npm run test:fixture
      - name: Audit locked dependencies
        run: npm audit --audit-level=high
      - name: Check TypeScript
        run: npx --no-install tsc --noEmit
      - name: Build the MCP app
        run: npm run build
      - name: Verify actual loopback MCP and disabled cloud routes
        run: npm run test:runtime
