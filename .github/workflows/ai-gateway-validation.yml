name: AI Gateway validation

on:
  pull_request:
    paths:
      - 'ai-gateway/**'
      - '.github/workflows/ai-gateway-validation.yml'
  push:
    branches: [main]
    paths:
      - 'ai-gateway/**'
      - '.github/workflows/ai-gateway-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ai-gateway/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        run: npm run check
      - name: Test API using mock provider
        run: npm test
