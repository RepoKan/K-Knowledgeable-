name: KKS governance validation

on:
  pull_request:
    paths:
      - "README.md"
      - "CHATGPT_CONNECTOR_GUIDE.md"
      - "chatgpt-connector-channel.json"
      - "scripts/validate_kks_governance.py"
      - ".github/workflows/kks-governance-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate KKS governance contract
        run: python3 scripts/validate_kks_governance.py
