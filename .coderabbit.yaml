# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Preserve existing review settings; correct only the title requirement.
# Approvals are limited to low merge risk and require a completed review of the
# latest commit; the author cannot trigger approval commands on their own PRs.
inheritance: true
reviews:
  auto_approvals:
    enabled: true
    allow_author_approval: false
    max_merge_risk: low
  pre_merge_checks:
    title:
      mode: error
      requirements: >-
        Use a descriptive Conventional Commits title under 80 characters in total.
        End the title with the exact suffix "Kantapon Meesongnuen Comments".
        Count the suffix and separating space within the 80-character limit.
